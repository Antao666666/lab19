name: CI/CD Pipeline Task 2
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Build Docker image
        run: docker build -t my-nestjs-app .
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push Docker image
        run: |
          docker tag my-nestjs-app ${{ secrets.DOCKER_USERNAME }}/my-nestjs-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/my-nestjs-app:latest
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.12.12
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "my-nestjs-app"
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          docker: true